[package]
name = "wifi-radar-fuse"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Multi-node observation fusion aggregator CLI (passive, best-effort)"
readme = "README.md"

[[bin]]
name = "wifi-radar-fuse"
path = "src/main.rs"

[dependencies]
wifi-radar-core = { workspace = true }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[dev-dependencies]
wifi-radar-core = { workspace = true }
