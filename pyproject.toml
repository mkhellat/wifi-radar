[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wifi-radar"
version = "0.1.0"
description = "Interactive terminal radar for nearby WiFi access points, clients, and probe-only adapters."
readme = "README.md"
license = { text = "GPL-3.0-or-later" }
requires-python = ">=3.11"
authors = [{ name = "wifi-radar contributors", email = "mkhellat@users.noreply.github.com" }]
keywords = ["wifi", "nl80211", "radar", "tui", "linux", "wireless"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console :: Curses",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Networking :: Monitoring",
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.11",
]
docs = [
    "sphinx>=7.0",
    "sphinx-rtd-theme>=2.0",
    "sphinx-autodoc-typehints>=2.0",
    "myst-parser>=3.0",
]

[project.scripts]
wifi-radar = "wifi_radar.cli:main"

[project.urls]
Homepage = "https://github.com/mkhellat/wifi-radar"
Issues = "https://github.com/mkhellat/wifi-radar/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
wifi_radar = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"src/wifi_radar/ui/*.py" = ["SIM102", "SIM105"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["wifi_radar"]
mypy_path = "src"
