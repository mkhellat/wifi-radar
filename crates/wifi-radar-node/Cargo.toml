[package]
name = "wifi-radar-node"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Sensing node agent: scan and publish NodeObservation batches"
readme = "README.md"

[[bin]]
name = "wifi-radar-node"
path = "src/main.rs"

[dependencies]
wifi-radar-core = { workspace = true }
wifi-radar-linux = { workspace = true }
serde_json = "1.0.154"

[dev-dependencies]
# 0.14.8+ needs rustc 1.88, above the workspace MSRV of 1.75.
rcgen = "=0.14.7"
