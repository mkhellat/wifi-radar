[package]
name = "wifi-radar-py"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "PyO3 bindings for wifi-radar (Maturin / PyPI façade)"
readme = "README.md"

[lib]
name = "wifi_radar_native"
crate-type = ["cdylib", "rlib"]

[features]
default = []
# Enabled by maturin when building the extension module.
extension-module = ["pyo3/extension-module"]

[dependencies]
wifi-radar-core = { workspace = true }
pyo3 = { version = "0.23", features = ["abi3-py311"] }
